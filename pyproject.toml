[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-budget"
version = "0.2.0"
description = "Conservative weekly quota planning for Codex Desktop and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuri Trukhin" }]
dependencies = []
keywords = ["codex", "quota", "budget", "plugin"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/trukhinyuri/codex-budget"
Issues = "https://github.com/trukhinyuri/codex-budget/issues"

[project.scripts]
codex-budget = "codex_budget.cli:main"

[tool.setuptools]
packages = ["codex_budget"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402", "B017"]
"scripts/*" = ["E402"]
"codex_budget/entry.py" = ["E402"]
